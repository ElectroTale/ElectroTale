# Construit l'installateur Windows à chaque version publiée (tag v*), ou à la demande.
name: Installateur Windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: npm install --no-audit --no-fund
      - run: ./build-win.sh
      - run: mv ElectroTale-Installation.exe "ElectroTale-Installation-${GITHUB_REF_NAME#v}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroTale-Installation
          path: ElectroTale-Installation-*.exe
      - name: Publier la version sur GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ÉlectroTale ${{ github.ref_name }} bêta
          prerelease: true
          files: ElectroTale-Installation-*.exe
          body: |
            Version bêta d'ÉlectroTale, réservée aux 18 ans et plus.
            Télécharge ElectroTale-Installation.exe ci-dessous. Si Windows affiche « Windows a protégé votre ordinateur », clique sur « Informations complémentaires » puis « Exécuter quand même ».
