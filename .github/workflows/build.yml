# Construit l'installateur Windows à la demande (ou sur un tag v*) et le publie comme version GitHub.
name: Installateur Windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: npm install --no-audit --no-fund
      - run: ./build-win.sh
      - name: Lire le numéro de version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - run: mv ElectroTale-Installation.exe "ElectroTale-Installation-$VERSION.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroTale-Installation
          path: ElectroTale-Installation-*.exe
      - name: Publier la version sur GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ÉlectroTale ${{ env.VERSION }} bêta
          prerelease: true
          files: ElectroTale-Installation-*.exe
          body: |
            Version bêta d'ÉlectroTale, réservée aux 18 ans et plus.
            Télécharge ElectroTale-Installation.exe ci-dessous. Si Windows affiche « Windows a protégé votre ordinateur », clique sur « Informations complémentaires » puis « Exécuter quand même ».
